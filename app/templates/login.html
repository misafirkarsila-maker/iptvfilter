<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — Xtream Filter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d13;
      --card-bg: rgba(22, 27, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #4f8cff;
      --accent-glow: rgba(79, 140, 255, 0.35);
      --accent-hover: #3a75e8;
      --text: #f0f3f8;
      --text-muted: #8b95a8;
      --error: #ef4444;
      --input-bg: rgba(13, 16, 24, 0.9);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(79, 140, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      position: relative;
      overflow: hidden;
    }

    .box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4f8cff, #6366f1);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(79, 140, 255, 0.12);
      border: 1px solid rgba(79, 140, 255, 0.25);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    input[type=password], input[type=text] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 40px 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    input[type=password]:focus, input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .btn {
      background: linear-gradient(135deg, #4f8cff 0%, #3a75e8 100%);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      width: 100%;
      box-shadow: 0 4px 12px rgba(79, 140, 255, 0.35);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 140, 255, 0.45);
    }

    .err-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.82rem;
      padding: 9px 12px;
      border-radius: 6px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <span>📡</span>
      <span>XTREAM FILTER</span>
    </div>
    <h1>Yönetici Girişi</h1>
    <p class="desc">Panele devam etmek için panel şifrenizi girin.</p>

    <form method="post" action="/login">
      <label for="password">Panel Şifresi</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" autofocus required placeholder="••••••••">
        <button type="button" class="toggle-pass" onclick="togglePass()" title="Şifreyi Göster/Gizle">👁️</button>
      </div>
      <button class="btn" type="submit">Giriş Yap</button>
    </form>

    {% if error %}
    <div class="err-msg">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}
  </div>

  <script>
    function togglePass() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
